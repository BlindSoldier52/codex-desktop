name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.15"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt nuitka ordered-set zstandard

      - name: Compile with Nuitka
        run: >
          python -m nuitka run.py
          --onefile
          --msvc=latest
          --assume-yes-for-downloads
          --windows-console-mode=disable
          --output-dir=build
          --output-filename=CodexDesktop.exe

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force package/CodexDesktop | Out-Null
          Copy-Item build/CodexDesktop.exe, README.md, GITHUB.md package/CodexDesktop/

      - uses: actions/upload-artifact@v7
        with:
          name: CodexDesktop
          path: package/CodexDesktop
          if-no-files-found: error
